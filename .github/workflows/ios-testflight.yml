name: Deploy to TestFlight

# Archives the iOS app and uploads it to TestFlight via fastlane.
#
# Signing uses an App Store Connect API key for auth, and fastlane match
# (readonly) for the certificate and profile. The match repo is droob's, shared
# rather than forked: a distribution cert is per-team, Apple caps how many a
# team may hold, and both apps sign under team 97DNR5Y3Y5. See the comments in
# mobile/ios/fastlane/Fastfile.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/ios/**'
      - '.github/workflows/ios-testflight.yml'
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: macos-15
    timeout-minutes: 60

    defaults:
      run:
        working-directory: mobile/ios

    env:
      APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
      APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
      APP_STORE_API_KEY_P8: ${{ secrets.APP_STORE_API_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Decrypts the match repo, and clones it over HTTPS basic auth.
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_GIT_USER: ${{ secrets.MATCH_GIT_USER }}
      MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: '120'
      FASTLANE_XCODEBUILD_SETTINGS_RETRIES: '5'
      # fastlane errors out on a non-UTF-8 locale; runners don't set one.
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # >= 3.3, because Gemfile.lock resolves excon 1.7.0 which requires it.
          # Keep this at or above whatever the lockfile's floor is after a
          # `bundle update` — the failure is at `bundle install`, not at runtime.
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: mobile/ios

      - name: Install XcodeGen
        run: brew install xcodegen

      # Required, not optional: QuickIn.xcodeproj commits project.pbxproj but NOT
      # a shared scheme (xcshareddata/ is empty), so `xcodebuild -scheme QuickIn`
      # would fail on a clean checkout. xcodegen regenerates both from project.yml.
      - name: Generate Xcode project
        run: xcodegen generate

      - name: Deploy to TestFlight
        run: bundle exec fastlane beta

      # Archive logs so a signing/upload failure is diagnosable without a rerun.
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fastlane-logs
          path: |
            ~/Library/Logs/gym/
            mobile/ios/fastlane/report.xml
          if-no-files-found: ignore
          retention-days: 7
