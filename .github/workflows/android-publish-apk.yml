name: Publish Debug APK

# Builds the Android debug APK on every push that touches the app and commits it
# back to `publishs/` at the repo root, keeping only the 2 most recent builds.
#
# `publishs/` sits OUTSIDE the paths filter below, so the bot's own commit can
# never retrigger this workflow (the `[skip ci]` marker is a second guard).
# Root .gitignore ignores `*.apk` globally but un-ignores `publishs/*.apk`.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-publish-apk.yml'
  workflow_dispatch:

concurrency:
  group: publish-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      # AGP 8.7.3 targets JDK 17; the app also compiles with sourceCompatibility 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant gradlew permission
        working-directory: mobile/android
        run: chmod +x ./gradlew

      # The JVM unit tests (app/src/test) — currently EmailRulesTest, the Kotlin
      # mirror of the backend's email-core suite. Runs BEFORE the APK is built so
      # a build that disagrees with the API about who may open an account never
      # reaches publishs/.
      - name: Unit tests
        working-directory: mobile/android
        run: ./gradlew testDebugUnitTest --no-daemon

      # Debug only: the release signing config expects an app/release.keystore
      # that is deliberately git-ignored, so `assembleRelease` cannot run here.
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      # Google Sign-In matches (package name + signing SHA-1) against an OAuth Android
      # client in the Cloud console, so the published APK's fingerprint has to be a
      # constant. It used to be whatever keystore Gradle happened to mint on the runner —
      # a new one every run — which made Google sign-in impossible on every build we
      # shipped to testers. app/debug.keystore now pins it; this step fails the build if
      # anything ever un-pins it again, and prints the value to register.
      - name: Verify the APK's signing fingerprint is the pinned one
        working-directory: mobile/android
        run: |
          EXPECTED="D1:2E:E0:C1:DB:FD:18:9A:E4:27:54:0A:99:49:53:CF:A6:27:C6:87"
          ACTUAL=$(keytool -list -v -keystore app/debug.keystore -alias androiddebugkey \
            -storepass android | grep -oE 'SHA1: [0-9A-F:]+' | cut -d' ' -f2)
          echo "Debug signing SHA-1: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Debug signing SHA-1 changed ($ACTUAL != $EXPECTED)." \
                 "Google Sign-In will fail with DEVELOPER_ERROR until this fingerprint is" \
                 "registered as an Android OAuth client for com.quickin.app." >&2
            exit 1
          fi

      - name: Copy APK to publishs/
        run: |
          mkdir -p publishs
          TS=$(date -u +"%Y-%m-%d_%H%M")
          SHA=${GITHUB_SHA::7}
          SRC=$(find mobile/android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$SRC" ]; then
            echo "No APK found!" >&2
            exit 1
          fi
          cp "$SRC" "publishs/quickin-android-${TS}-${SHA}.apk"
          # Keep only the 2 most recent APKs (filenames sort chronologically).
          ls -1 publishs/quickin-android-*.apk | sort | head -n -2 | xargs -r rm -f
          ls -lh publishs/

      - name: Commit and push APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A publishs/
          if git diff --cached --quiet; then
            echo "No new APK to commit"
            exit 0
          fi
          git commit -m "ci: publish debug APK [skip ci]"
          # Several people/agents push to this repo, so main can move between
          # checkout and push. Rebase and retry rather than failing the run —
          # this commit only ever adds/removes files under publishs/.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt ${attempt}"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing onto origin/main"
            git pull --rebase origin main
          done
          echo "Could not push APK after 3 attempts" >&2
          exit 1
