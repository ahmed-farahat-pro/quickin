name: QuickIn
options:
  bundleIdPrefix: com.quickin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  # Google Maps iOS SDK (Swift Package Manager). Used by the Explore map and the
  # host add-listing pin-picker. The package resolves a large binary on first
  # build, so the initial `xcodebuild` can take a few minutes.
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    from: "9.0.0"
  # Firebase iOS SDK (Swift Package Manager). We only pull in FirebaseMessaging
  # (Cloud Messaging) so the app can register its FCM token with the backend,
  # which sends push via FCM HTTP v1. Like GoogleMaps this resolves a large
  # dependency graph on first build, so the initial `xcodebuild` can take a few
  # minutes. Pinned to the 11.x line.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.6.0"
targets:
  QuickIn:
    type: application
    platform: iOS
    sources:
      - Sources
      # Bundle the Firebase config into the app so `FirebaseApp.configure()`
      # finds it at runtime. It lives at the project root (one level up from
      # Sources); xcodegen copies it into the .app bundle's Resources.
      - path: GoogleService-Info.plist
        buildPhase: resources
    dependencies:
      - package: GoogleMaps
        product: GoogleMaps
      # Cloud Messaging (push). Registers the FCM token with the backend.
      - package: Firebase
        product: FirebaseMessaging
    # Associated Domains + push. Declared here so xcodegen regenerates
    # QuickIn.entitlements with the Universal Links domain on every
    # `xcodegen generate` (the file is otherwise hand-maintained). The path
    # matches CODE_SIGN_ENTITLEMENTS in `settings.base` below.
    entitlements:
      path: QuickIn.entitlements
      properties:
        aps-environment: development
        # Universal Links: lets a shared https://quickin-frontend.vercel.app/…
        # link open the app instead of Safari (requires the matching AASA file
        # hosted on that domain). See ShareLinks.swift / DeepLinkRouter.swift.
        com.apple.developer.associated-domains:
          - applinks:quickin-frontend.vercel.app
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: QuickIn
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Custom URL scheme `quickin://` — a no-server-config deep-link fallback
        # (e.g. quickin://explore/<id>) that works even without the AASA file.
        CFBundleURLTypes:
          - CFBundleURLName: com.quickin.ahmed
            CFBundleURLSchemes:
              - quickin
          # Google OAuth callback. The reversed form of the iOS OAuth client id in
          # Config.swift (`Config.googleRedirectScheme`) — Google redirects here at
          # the end of the sign-in flow in SocialSignIn.swift. Keep the two in sync:
          # changing the client id means changing this scheme too.
          - CFBundleURLName: com.googleusercontent.apps
            CFBundleURLSchemes:
              - com.googleusercontent.apps.293984451588-r5agnhcstsb57hbn3eb2u0ie081c4cik
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # QuickIn is a portrait-first design. Now that the app is Universal (iPhone + iPad),
        # Apple requires an iPad app to EITHER support all four orientations (for Split View
        # multitasking) OR declare it requires the full screen. We opt out of iPad multitasking
        # so we can stay portrait-only — this clears the "Invalid bundle … UISupportedInterface
        # Orientations … to support iPad multitasking" upload error.
        UIRequiresFullScreen: true
        # Required purpose string: the GoogleMaps SDK references location APIs, so
        # Apple (ITMS-90683) requires this even though we only show pins, not the
        # user's location. Shown if/when location is ever requested.
        NSLocationWhenInUseUsageDescription: "QuickIn uses your location to show nearby stays and center the map."
        # Face ID: shown the first time the app evaluates biometrics to unlock a
        # saved session on the sign-in screen (LocalAuthentication). Touch ID
        # devices don't require a usage string.
        NSFaceIDUsageDescription: "Use Face ID to sign in to QuickIn faster."
        # ID verification: camera to photograph the ID card (front + back) and
        # photo library to pick existing images. The photos are uploaded to the
        # backend over HTTPS only (no local/plain-HTTP networking).
        NSCameraUsageDescription: "QuickIn needs camera access to photograph your ID card for verification."
        NSPhotoLibraryUsageDescription: "QuickIn needs photo library access to let you choose your ID card image."
        # Declare no non-exempt encryption so TestFlight skips the export-compliance
        # prompt on every build (standard HTTPS/TLS is exempt).
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # 1.0.0 through 1.3.0 are all APPROVED, CLOSED trains on App Store
        # Connect. Uploading to a closed train fails with 90186 ("train version is
        # closed") and 90062 (CFBundleShortVersionString must exceed the last
        # approved version). Every upload needs a marketing version HIGHER than
        # anything already approved. Each train has closed while a build for it was
        # in flight — 1.2.0 did, which is what opened 1.3.0, and 1.3.0 did on
        # 2026-08-22, which is what opened 1.4.0. fastlane's beta lane now checks
        # this against App Store Connect before it archives and tells you what to
        # bump to, so a closed train costs a second rather than a full build.
        MARKETING_VERSION: "1.4.0"
        # Build number must be unique across every train, forever — a number is
        # burned even by an upload that later goes INVALID. fastlane's beta lane
        # overrides this at build time with (highest number it can find) + 1, and
        # this value is one of the inputs to that max: a committed floor for
        # numbers App Store Connect will not report back. Raise it to the number
        # in Apple's `previousBundleVersion` whenever an upload is rejected as a
        # duplicate. 28 was the highest upload as of 2026-08-22, while the
        # TestFlight build list only went up to 6.
        CURRENT_PROJECT_VERSION: "28"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.quickin.ahmed
        CODE_SIGN_ENTITLEMENTS: QuickIn.entitlements
        # Automatically-managed signing under the dev team that has valid Apple
        # Development certs on this Mac (U4NBL42U65), so the app builds and runs on
        # a device. (97DNR5Y3Y5 — mafesh's team — only has a Distribution cert here,
        # which can't sign development builds → "Profile doesn't include the selected
        # signing certificate". Switch to 97DNR5Y3Y5 only when archiving for TestFlight.)
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "U4NBL42U65"

# A *shared* scheme, so `xcodebuild -scheme QuickIn` works on a clean checkout.
# Without this block XcodeGen emits no scheme at all: opening the project in
# Xcode silently creates a per-user one under xcuserdata/ (git-ignored), which
# is why this only breaks on CI — with "scheme QuickIn is not configured".
# archive/profile are pinned to Release because fastlane archives from here.
schemes:
  QuickIn:
    build:
      targets:
        QuickIn: all
    run:
      config: Debug
    test:
      config: Debug
    analyze:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
